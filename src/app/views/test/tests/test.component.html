<section class="test" *ngIf="quiz">
  <div class="container">
    <div class="test-pre-title" id="pre-title">
      {{ quiz.name }}
    </div>
    <div class="test-progress-bar" id="progress-bar">
    </div>
    <div class="test-question">
      <div class="test-question-title" id="title">
        <span>Вопрос {{ currentQuestionIndex }}:</span> {{ activeQuestion.question }}
      </div>
      <div class="test-question-options" id="options">
        <div class="test-question-option" *ngFor="let answer of activeQuestion.answers">
          <input class="option-answer" id="answer-{{answer.id}}" [(ngModel)]="choosenAnswerId" type="radio" name="answer"
                 value="{{answer.id}}">
          <label for="answer-{{answer.id}}">{{answer.answer}}</label>
        </div>
      </div>
    </div>
    <div class="test-actions">
      <div class="test-previous-action">
        <button class="button button-transparent" id="prev" disabled>Назад</button>
      </div>
      <div class="test-time">
        <div class="test-time-text">Осталось времени:</div>
        <div class="test-time-clock" id="timer">{{ timerSeconds }}</div>
      </div>
      <div class="test-next-action">
        <button class="button button-transparent" id="next" [disabled]="!choosenAnswerId">Далее</button>
      </div>
    </div>
    <div class="pass-question">
      <a href="javascript:void(0)" id="pass">Пропустить вопрос <img alt="Стрелка" src="/assets/images/small-arrow.png"></a>
    </div>

  </div>
</section>
